<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubbles Tesla sign-in</title>
<body style="font-family:sans-serif;padding:1.5em;max-width:40em">
<h2>🫧 Tesla sign-in done</h2>
<p>Copy this code and paste it into the secure box in your Bubbles chat (it expires in a few minutes):</p>
<textarea id="c" readonly style="width:100%;height:8em;font-size:14px"></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Copied ✓'" style="font-size:18px;padding:.5em 1em">Copy code</button></p>
<p id="e" style="color:#b00"></p>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||'';if(p.get('error'))document.getElementById('e').textContent='Error: '+p.get('error')+' '+(p.get('error_description')||'');</script>
</body>
